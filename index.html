<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chocalico · Chocolats artisanaux</title>
<meta name="description" content="Chocalico, chocolats artisanaux inspirés par Aban, notre chatte calico.">
<meta property="og:title" content="Chocalico · Chocolats artisanaux">
<meta property="og:image" content="chocalico.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
  :root {
    --bg: #f3e6d6;
    --ink: #4a2a17;
    --muted: #8a6447;
    --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--display);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    box-sizing: border-box;
  }
  figure { margin: 0; width: 100%; max-width: 1100px; }
  img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(74, 42, 23, 0.22);
  }
  figcaption {
    margin-top: 14px;
    text-align: center;
    font-size: 1.15rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>
<figure>
  <img src="chocalico.jpg" alt="Chocalico, chocolats artisanaux : Aban la chatte calico parmi des chocolats faits main, et l'histoire de la marque.">
  <figcaption>Chocalico · Chocolats artisanaux</figcaption>
</figure>
</body>
</html>
